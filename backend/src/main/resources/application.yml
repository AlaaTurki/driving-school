spring:
  application:
    name: driving-school-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/driving_school}
    username: ${DATABASE_USERNAME:driving_school}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT15M
    refresh-expiration: P7D
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs
